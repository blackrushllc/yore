<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full-Screen WYSIWYG Editor</title>

    <!-- TinyMCE from CDN -->
    <script src="https://cdn.tiny.cloud/1/pvy15ujg31l5nm544zx0wwkjc1k5qoan7drce1mpm2d3hd5d/tinymce/7/tinymce.min.js" referrerpolicy="origin"></script>


    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        #editor-container {
            height: calc(100% - 50px);
        }

        #save-button {
            width: 100%;
            height: 50px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }

        #save-button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<textarea id="editor-container"></textarea>

<button id="save-button">Save</button>

<script>
    // Initialize TinyMCE editor
    tinymce.init({
        selector: '#editor-container',
        plugins: [
            // Core editing features
            'anchor', 'autolink', 'charmap', 'codesample', 'emoticons', 'image', 'link', 'lists', 'media', 'searchreplace', 'table', 'visualblocks', 'wordcount',
            // Your account includes a free trial of TinyMCE premium features
            // Try the most popular premium features until Oct 29, 2024:
            //'checklist', 'mediaembed', 'casechange', 'export', 'formatpainter', 'pageembed', 'a11ychecker', 'tinymcespellchecker', 'permanentpen', 'powerpaste', 'advtable', 'advcode', 'editimage', 'advtemplate', 'ai', 'mentions', 'tinycomments', 'tableofcontents', 'footnotes', 'mergetags', 'autocorrect', 'typography', 'inlinecss', 'markdown',
        ],
        height: '90%',
        setup: function (editor) {
            editor.on('init', function () {
                // Load document content from load.php
                fetch('load.php')
                    .then(response => response.text())
                    .then(data => editor.setContent(data))
                    .catch(err => console.error('Failed to load document:', err));
            });
        },
        toolbar: 'undo redo | blocks fontfamily fontsize | bold italic underline strikethrough | link image media table mergetags | addcomment showcomments | spellcheckdialog a11ycheck typography | align lineheight | checklist numlist bullist indent outdent | emoticons charmap | removeformat',
        tinycomments_mode: 'embedded',
        tinycomments_author: 'Author name',
        mergetags_list: [
            { value: 'First.Name', title: 'First Name' },
            { value: 'Email', title: 'Email' },
        ],
        ai_request: (request, respondWith) => respondWith.string(() => Promise.reject('See docs to implement AI Assistant')),
    });

    // Save button functionality
    document.getElementById('save-button').addEventListener('click', function () {
        var content = tinymce.get('editor-container').getContent();

        fetch('save.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: 'content=' + encodeURIComponent(content)
        })
            .then(response => response.text())
            .then(result => {
                alert('Document saved successfully!');
            })
            .catch(error => {
                console.error('Error saving document:', error);
            });
    });
</script>

</body>
</html>
