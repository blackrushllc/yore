<!-- THIS VIEW OVERRIDES THE ONE FROM THE Users MODULE -->
<style>
    pre {
        line-height: 1;
        margin: 0;
        padding: 0;
        color: red;
        overflow: hidden;
        font-size: 50%;
    }

    body {
        color: #335599;
        font-size: 100%;
        background-image: url(/themes/app/images/blue-curve-background.jpg);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-color: #ddd;
    }

    input, textarea {
        width: 300px;
    }

    label {
        font-size: 90%;
    }

    .error {
        color: red;
        display: none;
    }

    .terms {
        cursor: pointer;
        color: darkblue;
        text-decoration: underline;
    }

    .terms:hover {
        color: darkred;
    }

    #termsText {
        padding: 8px;
        font-size: 90%;
        background-color: #98c0f4;
    }
</style>

<div class="container">

    <div style="text-align:center;">
        <img src="/themes/app/images/yore2.png" style="width:340px;">
        <h3>Register New User</h3>
    </div>

    <form name="registrationForm" id="registrationForm" method="post" autocomplete="off">
        <!-- First Row with 2 Centered Columns -->
        <!-- ?? AT app_post('register') -->
        <input type="hidden" name="action" value="register-user">

        <div class="row">
            <div class="col-md-6 col-12">
                <div class="lucy">
                    <div>
                        <label for="name">User Name:<br>
                            <input type="text" name="name" id="user_name" minlength="3"
                                   maxlength="40" required autocomplete="off">
                        </label>
                    </div>
                    <div>
                        <label for="phone">User Phone:<br>
                            <input placeholder="###-###-####" type="text" name="phone"
                                   id="user_phone" minlength="10" maxlength="20" required autocomplete="off">
                        </label>
                        <!--                        <div style="font-size:50%;">May be used for MFA</div>-->
                    </div>
                    <div>
                        <label for="email">User Email:<br>
                            <input placeholder="You@email.com" type="email" name="email"
                                   id="user_email" required autocomplete="off">
                        </label>
                        <div style="font-size:50%;">May be used for MFA</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-12">
                <div class="lucy">
                    <div>
                        <label for="password">User Password:<br>
                            <input type="password" name="password" id="app_password" minlength="8"
                                   maxlength="32" required autocapitalize="off" autocomplete="off">
                        </label>
                    </div>
                    <div>
                        <label for="password2">Confirm User Password:<br>
                            <input type="password" name="password2" id="app_password2" minlength="8"
                                   maxlength="32" required autocapitalize="off" autocomplete="off">
                        </label>
                        <span id="passwordError" class="error"><br/>Passwords do not match!</span>
                    </div>
                    <div style="font-size:90%;">
                        <input type="checkbox" name="terms" id="terms" style="width: 30px;"> Accept <span class="terms">Terms of Service</span>
                        <span id="termsError" class="error"><br/>You must accept the terms!</span>
                    </div>
                    <div id="termsText" style="display:none;">
                        <h4>Terms and Conditions</h4>
                        <p>Please visit our website to review our Terms, Conditions and Privacy Policies</p>
                    </div>
                    <div>
                        <br/>
                        <input type="submit" value="Register" class="btn btn-primary">
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    // Define the allowed characters regex
    const allowedCharacters = /[^a-zA-Z0-9 ()\-.,'/&#@]+/g;

    $(document).ready(function () {
        setTimeout(function () {
            $('#app_password').val('');
            $('#user_email').val('');
        }, 1000);

        $('.terms').on('click', function () {
            $("#termsText").toggle();
        })
    });

    // Function to clean the input, preserving single spaces during typing
    function cleanInput(input, isBlurEvent = false) {
        // Remove unwanted characters
        let cleaned = input.replace(allowedCharacters, '');

        // On blur or change, replace multiple spaces with a single space and trim
        if (isBlurEvent) {
            cleaned = cleaned.replace(/\s+/g, ' ').trim();
        }

        return cleaned;
    }

    // Function to apply filtering to the input field during typing
    function filterInput(event) {
        let inputElement = event.target;
        // If it's a blur or change event, remove repeated spaces and trim
        const isBlurOrChange = event.type === 'blur' || event.type === 'change';
        inputElement.value = cleanInput(inputElement.value, isBlurOrChange);
        //this.reportValidity();
    }

    // Attach event listeners to all input elements
    document.querySelectorAll('input').forEach(input => {

        // Grr .. I Can't use this in real time because for SOME REASON it prevents reportValidity() from working on submit. I tried all kinds of stuff :/

        // These fixups will have to be done on submit instead if using an addEventListener thingie

        input.addEventListener('input', filterInput);
        input.addEventListener('change', filterInput);
        input.addEventListener('blur', filterInput);
    });

    document.getElementById('registrationForm').addEventListener('submit', function (event) {
        // Get reference to the form
        const form = this;

        // Check if form fields meet built-in HTML5 validation rules
        if (!form.checkValidity()) {

            // If built-in validation fails, stop form submission
            event.preventDefault();
            form.reportValidity(); // Shows the default validation messages
            return;
        }

        // Prevent form submission for custom validation
        event.preventDefault();

        // Get input values
        const password = document.getElementById('app_password').value;
        const confirmPassword = document.getElementById('app_password2').value;
        const termsChecked = document.getElementById('terms').checked;

        let valid = true;

        // Check if passwords match
        if (password !== confirmPassword) {
            document.getElementById('passwordError').style.display = 'inline';
            valid = false;
        } else {
            document.getElementById('passwordError').style.display = 'none';
        }

        // Check if terms checkbox is checked
        if (!termsChecked) {
            document.getElementById('termsError').style.display = 'inline';
            valid = false;
        } else {
            document.getElementById('termsError').style.display = 'none';
        }

        // If everything is valid, submit the form
        if (valid) {

            form.submit(); // Submit the form programmatically
        }

    });
</script>
